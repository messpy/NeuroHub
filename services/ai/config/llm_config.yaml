llm:
  # 各プロバイダーはyamlの順序でテスト実行され、成功したものを採用（失敗はスキップ）
  default_settings:
    auto_fallback: true
    max_tokens: 200
    temperature: 0.3
    timeout: 30
    # デフォルトシステムプロンプト
    default_system_prompt: "あなたは親切で有能なAIアシスタントです。質問に対して、正確で分かりやすい日本語で回答してください。"

  logging:
    enabled: true
    log_level: 2
    store_debug_info: true

  # 用途別プロバイダー優先度設定
  priority_profiles:
    default:
      - ollama
      - gemini
      - huggingface

    coding:
      # コーディング用：精度重視
      - ollama
      - gemini
      - huggingface

    explanation:
      # 説明生成用：自然な文章重視
      - ollama
      - gemini

    image_analysis:
      # 画像分析用：マルチモーダル対応モデル優先
      - gemini  # Gemini Vision対応
      - ollama  # llava等のビジョンモデル

    safe_mode:
      # 安全第一：ローカルのみ
      - ollama

  providers:
    ollama:
      enabled: true
      priority: 1
      api_url: http://localhost:11434
      model: qwen2.5:1.5b-instruct
      max_tokens: 500
      temperature: 0.3
      timeout: 30
      # ビジョンモデル設定（画像分析用）
      vision_model: llava:7b
      # Modelfile設定
      modelfiles:
        enabled: true
        base_path: "services/llm/modelfiles"
        default_models:
          - name: "db_assistant_light"
            file: "db_assistant_light.Modelfile"
            description: "軽量データベースアシスタント"
          - name: "mcp_code_assistant"
            file: "mcp_code_assistant.Modelfile"
            description: "MCPコーディングアシスタント"
          - name: "test_mcp_assistant"
            file: "test_mcp_assistant.Modelfile"
            description: "MCPテストアシスタント"

    gemini:
      enabled: false  # API KEY設定後に有効化
      priority: 2
      api_key: ${GEMINI_API_KEY}
      model: gemini-1.5-flash
      max_tokens: 500
      temperature: 0.3
      timeout: 30
      # ビジョンモデル設定
      vision_model: gemini-1.5-flash

    huggingface:
      enabled: false  # API KEY設定後に有効化
      priority: 3
      api_key: ${HUGGINGFACE_API_KEY}
      model: microsoft/phi-2
      max_tokens: 500
      temperature: 0.3
      timeout: 30
